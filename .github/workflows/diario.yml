name: Monitor Diario TCAE Estatutario (BOE, DOGV y Sindicatos)

on:
  schedule:
    - cron: '30 8 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutar-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librería requests
        run: pip install requests

      - name: Ejecutar monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Guardar historial de avisos enviados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vistos.txt || true
          git diff --staged --quiet || git commit -m "Actualizar historial de avisos"
          git push
